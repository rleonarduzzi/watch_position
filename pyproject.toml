[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattitude"
version = "0.1.0"
description = "Adaptive error-state Kalman filter for IMU attitude estimation (Bai et al., Section IV.A)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
bench = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tabulate>=0.9",
    "vqf>=2.0",
]
dev = [
    "pytest>=7.0",
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that take more than a few seconds",
    "broad: tests that require the BROAD dataset to be downloaded",
]
